# === Multi-Pass Spiral + Traditional Dwell Optimization ===

surface:
  grid_size: 128
  lens_diameter_mm: 50.0
  curvature_radius_mm: 200.0
  initial_roughness_nm: 200.0
  target_rms_um: 0.05

tif:
  ball_diameter_mm: 50.0
  default_concentration: 5.0

spiral:
  pitch_mm: 7.0
  num_passes: 10
  pass_pressures: [40, 28, 20, 14, 10, 7, 5, 4, 3, 2]
  fixed_speed: 800.0

env:
  patch_size: 16
  reward_weights:
    form: 5.0
    roughness: 1.0
    completion_bonus: 10.0
  action_ranges:
    dwell_time: [0.1, 5.0]

free_path:
  # If null, use the same waypoint count as the nominal multi-pass spiral.
  n_waypoints:
  n_control_points: 48
  n_iters: 3000
  lsq_interval: 100
  lr: 0.01
  # Hard-constraint optimization starts from a smooth feasible path.
  initializer:
    path: smooth_spiral
    turns: 4.0
    min_radius_mm: 0.0
    max_radius_frac: 0.96
  allow_infeasible_steps: false
  projection_backtrack_steps: 8
  max_turn_angle_deg: 10.0
  min_turn_radius_mm: 8.0
  motion:
    # Effective feed speed is computed as local path distance / dwell time.
    speed_min_mm_s: 0.05
    speed_max_mm_s: 30.0
    max_accel_mm_s2: 20.0
  weights:
    form: 5.0
    overpolish: 10.0
    smoothness: 0.5
    turn: 2.0
    turn_radius: 1.0
    spacing: 0.2
    radius: 100.0
    speed: 1.0
    accel: 0.1
