# === Multi-Pass Spiral + Dwell Time RL ===

surface:
  grid_size: 128
  lens_diameter_mm: 50.0
  curvature_radius_mm: 200.0
  initial_roughness_nm: 200.0
  target_rms_um: 0.05

tif:
  ball_diameter_mm: 50.0
  default_concentration: 5.0

spiral:
  pitch_mm: 7.0
  num_passes: 10
  pass_pressures: [40, 28, 20, 14, 10, 7, 5, 4, 3, 2]
  fixed_speed: 800.0

env:
  patch_size: 16
  reward_weights:
    form: 5.0
    roughness: 1.0
    completion_bonus: 10.0
  action_ranges:
    dwell_time: [0.1, 5.0]

training:
  algorithm: SAC
  total_timesteps: 2000000
  learning_rate: 0.0001
  batch_size: 256
  buffer_size: 500000
  learning_starts: 2000
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  log_interval: 10
  eval_freq: 5000
  n_eval_episodes: 3
  patience: 30
  seed: 42

policy:
  net_arch: [256, 256, 256]
